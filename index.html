<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-opVerify — محاكاة النظام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a44; --navy2:#173a5c; --teal:#0e7c7b; --teal-l:#e3f2f1;
  --bg:#f4f6f8; --card:#fff; --line:#dfe4ea; --ink:#1d2733; --mut:#5d6b7a;
  --ok:#1e8e5a; --ok-l:#e5f5ec; --bad:#c0392b; --bad-l:#fbeae8; --warn:#b7791f; --warn-l:#fdf3e1;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit}
.hidden{display:none!important}
td,dd,.chip span,.kv dd{unicode-bidi:plaintext}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#19a3a1,#0e7c7b);display:grid;place-items:center;font-weight:700}
.brand b{font-size:18px;letter-spacing:.3px}
.brand small{display:block;color:#b8c7d6;font-size:12px}
.spacer{flex:1}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#b9c3cf}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#0b6a69}
.btn.dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:#efc7c2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
nav.side{background:#fff;border-inline-end:1px solid var(--line);padding:16px 10px}
nav.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:4px}
nav.side a.on{background:var(--teal-l);color:var(--teal);font-weight:600}
nav.side a:hover:not(.on){background:#f1f4f7}
nav.side .role{font-size:12px;color:var(--mut);padding:4px 12px 12px}
main{padding:22px 26px;max-width:1250px;width:100%}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:500}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
input:focus,select:focus{outline:2px solid #9fd3d2;border-color:var(--teal)}
.field{margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}
.drop{border:2px dashed #c3ccd6;border-radius:var(--r);padding:22px;text-align:center;color:var(--mut);cursor:pointer;background:#fafbfc}
.drop.has{border-color:var(--teal);background:var(--teal-l);color:var(--teal)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-bad{background:var(--bad-l);color:var(--bad)}
.b-warn{background:var(--warn-l);color:var(--warn)} .b-mut{background:#eef1f4;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#f6f8fa;color:var(--mut);font-weight:600;text-align:start;padding:10px;border-bottom:1px solid var(--line);font-size:13px}
table.t td{padding:10px;border-bottom:1px solid #edf0f3;vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f7fbfb}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:embed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{font-size:13px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #e6eaee;color:var(--mut)}
.steps li .ic{width:22px;height:22px;border-radius:50%;border:2px solid #cfd6de;flex:none;display:grid;place-items:center;font-size:12px;margin-top:1px}
.steps li.run{color:var(--ink)} .steps li.run .ic{border-color:var(--teal);border-top-color:transparent;animation:sp .8s linear infinite}
.steps li.done{color:var(--ink)} .steps li.done .ic{background:var(--teal);border-color:var(--teal);color:#fff}
.steps li .d{font-size:12.5px;color:var(--mut)}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:6px;background:#e7ecf0;border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.res{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:14px}
.verdict.ok{background:var(--ok-l);border:1px solid #bfe3cf} .verdict.bad{background:var(--bad-l);border:1px solid #f0c4bf}
.verdict .big{font-size:21px;font-weight:700}
.verdict.ok .big{color:var(--ok)} .verdict.bad .big{color:var(--bad)}
.gauge{margin-inline-start:auto;text-align:center}
.gauge .n{font-size:24px;font-weight:700;direction:ltr}
.gauge .l{font-size:12px;color:var(--mut)}
.viewer{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#e9edf1}
.viewer canvas{display:block;width:100%;height:auto}
.viewer canvas.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vtools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13.5px}
.pages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pages button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.pages button.on{border-color:var(--teal);background:var(--teal-l);color:var(--teal);font-weight:600}
.pages button .s{direction:ltr;display:inline-block;margin-inline-start:6px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-all}
.note{font-size:12.5px;color:var(--mut);background:#f6f8fa;border-radius:8px;padding:8px 10px;margin-top:10px;border-inline-start:3px solid #c3ccd6}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.legend i{width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2b5cff,#00d0e0,#ffe000,#ff2a00)}
[dir=rtl] .legend i{background:linear-gradient(270deg,#2b5cff,#00d0e0,#ffe000,#ff2a00)}
.login-wrap{min-height:calc(100vh - 56px);display:grid;place-items:center;padding:30px}
.login{width:min(940px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.login .hero{background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#11506a);color:#fff;padding:34px}
.login .hero h2{margin:0 0 8px;font-size:24px}
.login .hero p{color:#c9d6e2;line-height:1.8;font-size:14px}
.login .hero ul{padding-inline-start:18px;color:#dbe6ef;font-size:13.5px;line-height:2}
.login form{padding:34px}
.demo{display:grid;gap:8px;margin-top:16px}
.demo button{text-align:start;border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.demo button:hover{border-color:var(--teal);background:var(--teal-l)}
.err{color:var(--bad);font-size:13.5px;min-height:20px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
[dir=ltr] .toast{transform:translateX(-50%)}
.toast.on{opacity:1}
.foot{color:var(--mut);font-size:12px;text-align:center;padding:18px}
.tabs-inline{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.status-pick{display:flex;gap:8px;flex-wrap:wrap}
.status-pick button{flex:1;min-width:120px}
.status-pick button.on.p{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}
.status-pick button.on.a{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.status-pick button.on.e{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--mut)}
.inline-edit{display:flex;gap:6px;align-items:center}
.inline-edit input{width:130px;padding:5px 8px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr} nav.side{display:flex;gap:4px;overflow:auto;border:0;border-bottom:1px solid var(--line);padding:8px}
  nav.side .role{display:none} nav.side a{margin:0;white-space:nowrap}
  .res,.grid2,.login{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)} main{padding:16px}
  .login .hero{display:none}
}
</style>
</head>

  <span id="userChip" class="chip hidden"></span>
  <button class="btn dark sm" id="langBtn"></button>
  <button class="btn dark sm hidden" id="logoutBtn" data-i18n="logout"></button>
</header>
<div id="root"></div>
<div class="toast" id="toast"></div>

async function sha256(data){
  const buf=typeof data==='string'?new TextEncoder().encode(data):data;

/* ============ heatmap model (simulated U-Net output) ============ */
const HW=100,HH=141;
function genHeat(seedN,regions,base){
  const r=rng(seedN),d=new Float32Array(HW*HH);
  for(let i=0;i<d.length;i++)d[i]=r()*base*.45;
  for(let k=0;k<7;k++){const cx=.12+r()*.76,cy=.18+r()*.7,sx=.02+r()*.06,sy=.008+r()*.015,a=base*(.5+r()*.6);
    for(let y=0;y<HH;y++)for(let x=0;x<HW;x++){const dx=(x/HW-cx)/sx,dy=(y/HH-cy)/sy;d[y*HW+x]+=a*Math.exp(-(dx*dx+dy*dy)/2)}}
  for(const g of regions){const s=.82+r()*.14,sg=.012;
    for(let y=0;y<HH;y++)for(let x=0;x<HW;x++){const px=(x+.5)/HW,py=(y+.5)/HH;
      const dx=Math.max(g.x-px,0,px-(g.x+g.w)),dy=Math.max(g.y-py,0,py-(g.y+g.h));
      d[y*HW+x]=Math.max(d[y*HW+x],s*(.88+.12*r())*Math.exp(-(dx*dx+dy*dy)/(2*sg*sg)))}}
  // light blur
  const o=new Float32Array(d.length);
  for(let y=0;y<HH;y++)for(let x=0;x<HW;x++){let s=0,n=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const xx=x+i,yy=y+j;if(xx>=0&&yy>=0&&xx<HW&&yy<HH){s+=d[yy*HW+xx];n++}}o[y*HW+x]=Math.min(1,s/n)}
  return o;
}
function pageScore(h){const a=Array.from(h).sort((x,y)=>y-x);const k=Math.max(10,Math.round(a.length*.003));let s=0;for(let i=0;i<k;i++)s+=a[i];return s/k}
function samplePages(form,edited,seedN){const regs=edited?formRegions(form,true):[];const heat=genHeat(seedN,regs,.26);return [{heat,score:pageScore(heat),form,edited}]}

  return new Date(Date.UTC(+m[1],(+m[2]||1)-1,+m[3]||1,+m[4]||0,+m[5]||0,+m[6]||0)).toISOString()}

  const n=(s.match(/\/Type\s*\/Page[^s]/g)||[]).length||1;return{creator:g('Creator'),producer:g('Producer'),created:pdfDate(g('CreationDate')),modified:pdfDate(g('ModDate')),pages:n}}

async function loadPdf(buf,name){
  let meta=regexMeta(buf),pages=[];
  if(pdfReady){try{
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
    try{const md=await doc.getMetadata();const i=md.info||{};meta={creator:i.Creator||meta.creator,producer:i.Producer||meta.producer,created:pdfDate(i.CreationDate)||meta.created,modified:pdfDate(i.ModDate)||meta.modified}}catch(e){}
    meta.pages=doc.numPages;
    for(let p=1;p<=Math.min(doc.numPages,6);p++){const pg=await doc.getPage(p);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:PW/v0.width});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;pages.push(c)}
    return {meta,pages,ok:true};
  }catch(e){console.log('pdf render failed',e)}}
  const n=Math.min(meta.pages||1,6);for(let i=0;i<n;i++)pages.push(placeholderPage(name));
  return {meta,pages,ok:false};
}

async function runAnalysis(){
  const err=$('#uerr');err.textContent='';
  if(!/^\d{9}$/.test(up.sid)){err.textContent=t('needId');return}
  if(up.src==='file'&&!up.file){err.textContent=t('needFile');return}
  $('#goBtn').disabled=true;document.querySelectorAll('#main input,#main select,#main .seg button').forEach(e=>e.disabled=true);
  const t0=performance.now();const timer=setInterval(()=>{$('#ptime').textContent=t('elapsed')+': '+((performance.now()-t0)/1000).toFixed(1)+'s'},100);
  const steps=['hash','conv','tile','unet','score','meta','save'];let si=0;
  const step=async(name,ms,detail)=>{const li=document.querySelector(`[data-s="${name}"]`);li.classList.add('run');await sleep(ms);li.classList.remove('run');li.classList.add('done');li.querySelector('.ic').textContent='✓';
    if(detail)li.querySelector('[data-d]').textContent=detail;si++;$('#pbar').style.width=(si/steps.length*100)+'%'};
  let hash,pagesImg=[],meta,heats=[],fileName,kind,seedN,ok=true;
  if(up.src==='sample'){
    kind='sample';seedN=Math.floor(Math.random()*1e9);fileName={start:'start_form',att:'attendance_form',eval:'evaluation_form'}[up.form]+(up.edited?'_v2':'')+'.pdf';
    hash=await sha256(up.form+up.edited+seedN);
  }else{
    kind='pdf';fileName=up.file.name;const buf=await up.file.arrayBuffer();hash=await sha256(buf);
    seedN=parseInt(hash.slice(0,8),16);
    var loaded=await loadPdf(buf,fileName);pagesImg=loaded.pages;meta=loaded.meta;ok=loaded.ok;
  }
  await step('hash',500,hash.slice(0,16)+'…');
  const nPages=kind==='sample'?1:pagesImg.length;
  await step('conv',700,`${nPages} ${t('pagesN')} · 200 DPI · 1654×2339`);
  await step('tile',500,`${nPages*20} ${t('tilesN')} (4×5 × ${nPages})`);
  // model
  let pages;
  if(kind==='sample'){pages=samplePages(up.form,up.edited,seedN)}
  else{const r=rng(seedN);let tamper=up.sim==='edit'||(up.sim==='auto'&&(parseInt(hash.slice(8,10),16)%10)<4);if(up.sim==='auth')tamper=false;
    const tp=tamper?Math.floor(r()*nPages):-1;
    pages=pagesImg.map((c,i)=>{const regs=i===tp?[{x:.25+r()*.4,y:.3+r()*.45,w:.08+r()*.12,h:.02+r()*.015}]:[];const heat=genHeat(seedN+i*7,regs,.26);return{heat,score:pageScore(heat),img:c}})}
  await step('unet',900+nPages*250,`U-Net · ${nPages} ${t('pagesN')}`);
  const scores=pages.map(p=>p.score),score=Math.max(...scores),verdict=score>=THRESH?'suspicious':'authentic';
  await step('score',400,`max = ${score.toFixed(2)} · ${t('threshold')} = ${THRESH.toFixed(2)}`);
  if(kind==='sample')meta=sampleMeta(up.form,up.edited,0);
  await step('meta',400,(meta.producer||meta.creator||'—'));
  const rec={id:Math.max(0,...db.records.map(r=>r.id))+1,date:new Date().toISOString(),userId:session,studentId:up.sid,fileName,hash,kind,
    form:kind==='sample'?up.form:null,edited:kind==='sample'?up.edited:null,seed:seedN,pageScores:scores,score,verdict,
    status:verdict==='suspicious'?'pending':null,imagesKept:verdict==='suspicious',meta:{...meta,pages:meta.pages||nPages},renderOk:ok};
  db.records.push(rec);save();pageCache[rec.id]=pages;freshId=rec.id;up.file=null;
  await step('save',400);
  clearInterval(timer);await sleep(350);
  view={name:'result',id:rec.id,from:'upload'};render();
}

function drawViewer(pages){
  const p=pages[vs.page];const base=$('#cBase'),hc=$('#cHeat'),tc=$('#cTile');if(!base)return;
  let W=PW,H=PH;
  if(p.img){W=p.img.width;H=p.img.height;base.width=W;base.height=H;base.getContext('2d').drawImage(p.img,0,0)}
  else{base.width=W;base.height=H;drawForm(base.getContext('2d'),p.form,p.edited)}
  hc.width=W;hc.height=H;tc.width=W;tc.height=H;
  const hx=hc.getContext('2d');hx.clearRect(0,0,W,H);
  if(vs.heat){const sm=document.createElement('canvas');sm.width=HW;sm.height=HH;const sx=sm.getContext('2d');const im=sx.createImageData(HW,HH);
    for(let i=0;i<HW*HH;i++){const v=p.heat[i];const [r,g,b]=colorize(v);im.data[i*4]=r;im.data[i*4+1]=g;im.data[i*4+2]=b;im.data[i*4+3]=v<.18?0:Math.round(Math.min(1,(v-.18)/.6)*255*vs.op)}
    sx.putImageData(im,0,0);hx.imageSmoothingEnabled=true;hx.imageSmoothingQuality='high';hx.drawImage(sm,0,0,W,H)}
  const tx=tc.getContext('2d');tx.clearRect(0,0,W,H);
  if(vs.tiles){tx.strokeStyle='rgba(14,124,123,.85)';tx.setLineDash([6,5]);tx.lineWidth=1.5;const cw=W/4,ch=H/5;
    for(let i=1;i<4;i++){tx.beginPath();tx.moveTo(i*cw,0);tx.lineTo(i*cw,H);tx.stroke()}for(let j=1;j<5;j++){tx.beginPath();tx.moveTo(0,j*ch);tx.lineTo(W,j*ch);tx.stroke()}
    tx.setLineDash([]);tx.font='12px monospace';tx.fillStyle='rgba(14,124,123,.9)';let n=1;for(let j=0;j<5;j++)for(let i=0;i<4;i++)tx.fillText('T'+(n++),i*cw+6,j*ch+16)}
}

   ${list.map(r=>`<tr class="click" data-id="${r.id}"><td>${fmtDate(r.date)}</td><td>${esc((db.users.find(x=>x.id===r.userId)||{}).name||'—')}</td><td class="mono">${esc(r.studentId)}</td><td>${formName(r)}</td><td class="mono" style="color:var(--bad)">${r.score.toFixed(2)}</td><td>${statusBadge(r.status)}</td><td><button class="btn sm">${t('open')}</button></td></tr>`).join('')}
  </tbody></table>`:`<div class="empty">${t('noRecords')}</div>`}</div>`;
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{view={name:'result',id:+tr.dataset.id,from:'queue'};render()});
}

/* ---- users (admin) ---- */
function renderUsers(){
  const u=me();
  $('#main').innerHTML=`<h1>${t('uTitle')}</h1><p class="sub">${t('uSub')}</p>
  <div class="card" style="margin-bottom:16px"><h3 style="margin:0 0 12px;font-size:16px">${t('addUser')}</h3>
   <form id="uf" class="row" style="align-items:flex-end">
    <div style="flex:1.3;min-width:160px"><label class="f">${t('u_name')}</label><input type="text" id="nName"></div>
    <div style="flex:1;min-width:130px"><label class="f">${t('u_user')}</label><input type="text" id="nUser" dir="ltr"></div>
    <div style="flex:1;min-width:120px"><label class="f">${t('password')}</label><input type="password" id="nPw" dir="ltr"></div>
    <div style="flex:1;min-width:150px"><label class="f">${t('u_role')}</label><select id="nRole">${['supervisor','staff','admin'].map(r=>`<option value="${r}">${t('r_'+r)}</option>`).join('')}</select></div>
    <button class="btn pri">${t('create')}</button></form><div class="err" id="ferr" style="margin-top:8px"></div></div>
  <div class="card" style="padding:0;overflow:auto"><table class="t"><thead><tr><th>${t('u_name')}</th><th>${t('u_user')}</th><th>${t('u_role')}</th><th>${t('u_hash')}</th><th>${t('u_state')}</th><th>${t('u_act')}</th></tr></thead><tbody>
   ${db.users.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono">${esc(x.username)}</td>
     <td><select data-role="${x.id}" style="width:auto;padding:5px 8px">${['supervisor','staff','admin'].map(r=>`<option value="${r}" ${x.role===r?'selected':''}>${t('r_'+r)}</option>`).join('')}</select></td>
     <td class="mono" title="${x.pw}">${x.pw.slice(0,14)}…</td>
     <td>${x.active?`<span class="badge b-ok">${t('active')}</span>`:`<span class="badge b-mut">${t('disabled')}</span>`}</td>
     <td><button class="btn sm ${x.active?'danger':''}" data-tog="${x.id}">${x.active?t('disable'):t('enable')}</button></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#uf').onsubmit=async e=>{e.preventDefault();const n=$('#nName').value.trim(),un=$('#nUser').value.trim(),pw=$('#nPw').value,r=$('#nRole').value;
    if(!n||!un||!pw){$('#ferr').textContent=t('fillAll');return}if(db.users.some(x=>x.username===un)){$('#ferr').textContent=t('userExists');return}
    db.users.push({id:db.nextUser++,name:n,username:un,role:r,active:true,pw:await sha256('coop:'+un+':'+pw)});save();toast(t('userCreated'));renderUsers()};
  document.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>{const x=db.users.find(y=>y.id===+s.dataset.role);x.role=s.value;save();toast('✓');if(x.id===u.id)render()});
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const x=db.users.find(y=>y.id===+b.dataset.tog);if(x.id===u.id){toast(t('cantSelf'));return}x.active=!x.active;save();renderUsers()});
}

/* ============ boot ============ */
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';store.set('cv_lang',lang);render()};
$('#logoutBtn').onclick=()=>{session=null;store.set('cv_session',null);freshId=null;render()};
(async()=>{
  lang=store.get('cv_lang')||'ar';
  try{await document.fonts.load('16px "IBM Plex Sans Arabic"');await document.fonts.load('700 16px "IBM Plex Sans Arabic"')}catch(e){}
  db=store.get('cv_db');if(!db||!db.users)db=await seed(),save();
  const s=store.get('cv_session');if(s&&db.users.some(u=>u.id===s&&u.active))session=s;
  render();
})();
</script>
</body>
</html>
